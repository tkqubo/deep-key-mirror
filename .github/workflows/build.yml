name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test:cov

      - name: Upload coverage to Codecov
        if: matrix.node-version == 22
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Pack tarball
        if: matrix.node-version == 22
        run: pnpm pack

      - name: Upload tarball artifact
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v7
        with:
          name: package-tarball
          path: deep-key-mirror-*.tgz
          retention-days: 7

  smoke:
    name: Smoke (Node ${{ matrix.node-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download package tarball
        uses: actions/download-artifact@v8
        with:
          name: package-tarball
          path: tarball

      - name: Install the packed package into a clean consumer project
        run: |
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer"
          cp scripts/smoke.mjs scripts/smoke.cjs "$consumer/"
          tarball="$(ls "$GITHUB_WORKSPACE"/tarball/*.tgz)"
          cd "$consumer"
          npm init -y >/dev/null
          npm install "$tarball"

      - name: Run ESM smoke test
        run: node "$RUNNER_TEMP/consumer/smoke.mjs"
        working-directory: ${{ runner.temp }}/consumer

      - name: Run CJS smoke test
        run: node "$RUNNER_TEMP/consumer/smoke.cjs"
        working-directory: ${{ runner.temp }}/consumer
